name: Release

on:
  push:
    tags: ['v*']

# Least privilege at the workflow level. The write token exists only in the publish job,
# so the third-party actions that build and check the jar never hold one.
#
# Every `uses:` is pinned to a commit SHA. Tags are mutable - a tag can be repointed at a
# new commit by whoever owns the action - so `@v4` is a moving target. SHAs below were
# resolved from the `v4` tags on 2026-09-11; re-resolve when upgrading.
permissions:
  contents: read

jobs:
  build:
    name: Build the release jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The token is read-only here and this job never pushes, but the build runs
          # Gradle plugins; do not leave a credential in .git/config for them.
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # A release that does not carry the version in gradle.properties is a mistake
      # people only discover after downloading it.
      - name: Tag matches mod_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version. Expected tag v$version."
            exit 1
          fi
          echo "Tag matches mod_version=$version"

      # Shipping a stale or truncated native bridge is the failure this project is most
      # exposed to, so gate the release on it. See docs/native-build.md for what these
      # checks do and do not prove.
      - name: Native artifact is intact
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c nvidia-sdk-native/native-artifact.sha256
          dll=nvidia-sdk-java/src/main/resources/natives/windows-x64/mc_reflex_tools_native.dll
          src=$(git log -1 --format=%H -- nvidia-sdk-native/src/jni_exports.cpp nvidia-sdk-native/CMakeLists.txt)
          bin=$(git log -1 --format=%H -- "$dll")
          if ! git merge-base --is-ancestor "$src" "$bin"; then
            echo "::error::The bridge source is newer than the checked-in binary. Rebuild it and commit the result."
            exit 1
          fi

      - name: Build Fabric artifact
        run: ./gradlew :fabric:build --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jars
          path: fabric/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Publish the prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-jars
          path: dist
      # Uses the preinstalled gh CLI rather than a release action, so this job - the only
      # one holding a write token - runs exactly one third-party action.
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            dist/*.jar
