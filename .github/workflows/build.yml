name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: Java 25 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric artifact
        run: ./gradlew :fabric:build --no-daemon
      # Downloadable from the run's summary page. Tagged builds go through
      # release.yml instead, which attaches the same jars to a prerelease.
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mc_reflex_tools-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

  native-bridge:
    name: Native bridge compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Without NVIDIA_STREAMLINE_ROOT this builds the readiness stub. That is the
      # point: it proves the bridge still compiles on a machine that has no SDK.
      - name: Configure CMake
        run: cmake -S nvidia-sdk-native -B nvidia-sdk-native/build
      - name: Build CMake target
        run: cmake --build nvidia-sdk-native/build --config Release

  # A consistency check for maintainers. It is NOT a provenance or trust gate, and it
  # must not be treated as one: CI cannot rebuild the DLL, because it links against
  # sl.interposer.lib and includes Streamline headers and neither may be placed on a
  # runner. Nothing in this job ties the checked-in binary to jni_exports.cpp. Verifying
  # that needs a machine with the SDK - see scripts/verify-native-dll.sh.
  native-artifact-integrity:
    name: Native artifact consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checked-in DLL matches the recorded checksum
        run: |
          set -euo pipefail
          sha256sum -c nvidia-sdk-native/native-artifact.sha256
      - name: Bridge source has not moved past the binary
        run: |
          set -euo pipefail
          dll=nvidia-sdk-java/src/main/resources/natives/windows-x64/mc_reflex_tools_native.dll
          src=$(git log -1 --format=%H -- nvidia-sdk-native/src/jni_exports.cpp nvidia-sdk-native/CMakeLists.txt)
          bin=$(git log -1 --format=%H -- "$dll")
          echo "last commit touching the bridge source: $src"
          echo "last commit touching the binary:       $bin"
          # Topological, not chronological: commit dates on a rebase or a backdated
          # clock mean nothing. If the source is an ancestor of the binary, the binary
          # was committed at or after it.
          if ! git merge-base --is-ancestor "$src" "$bin"; then
            echo "::error::The bridge source changed in a commit that is not an ancestor of the checked-in binary. Rebuild it (see docs/native-build.md) and commit the result."
            exit 1
          fi
          echo "The binary is at least as recent as the source it is built from."

  redistribution-guard:
    name: No NVIDIA SDK files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if NVIDIA SDK files are tracked
        run: |
          set -euo pipefail
          allowed='nvidia-sdk-java/src/main/resources/natives/windows-x64/mc_reflex_tools_native.dll'
          hits=$(git ls-files \
            | grep -Ei '(^|/)(sl[a-z0-9_.-]*\.(dll|lib|h|hpp)|nvngx[a-z0-9_.-]*\.(dll|lib)|nvapi[a-z0-9_.-]*\.(dll|lib|h))$' \
            | grep -vx "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "::error::The Streamline SDK and other NVIDIA SDK files are not redistributable and must not be committed:"
            echo "$hits"
            echo "See NOTICE.md."
            exit 1
          fi
          echo "No NVIDIA SDK files are tracked."
