name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: Java 25 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric and NeoForge artifacts
        run: ./gradlew build --no-daemon

  native-probe:
    name: Native JNI bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S nvidia-sdk-native -B nvidia-sdk-native/build
      - name: Build CMake target
        run: cmake --build nvidia-sdk-native/build --config Release
